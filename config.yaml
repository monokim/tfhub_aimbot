window:
  title: "Counter-Strike: Global Offensive"
  roi:
    enabled: false
    width: 640
    height: 640

capture:
  size_scale: 3

detector:
  model_url: "https://tfhub.dev/tensorflow/centernet/resnet50v1_fpn_512x512/1"
  class_person: 1
  score_threshold: 0.5
  filter:
    ymin_min: 0.5
    ymax_min: 0.8

target:
  head_offset_ratio: 0.45

control:
  mouse_scale: 1.7
  move_sleep_sec: 0.05
  click_hold_sec: 0.1
  loop_sleep_sec: 0.1
